<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="sensei">
  <defs>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d3b6f5"/>
      <stop offset="60%" stop-color="#a37fd0"/>
      <stop offset="100%" stop-color="#6d3fb0"/>
    </linearGradient>
  </defs>
  <!-- an enso: one brush stroke, left open. The gap is where the student goes. -->
